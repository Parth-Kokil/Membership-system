<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">🏋️ Membership System</h1>

    <!-- Register -->
    <div class="bg-white p-6 rounded-xl shadow mb-6">
      <h2 class="text-xl font-semibold mb-4">1. Register</h2>
      <input id="reg-name" placeholder="Full Name" class="border p-3 w-full mb-3 rounded-lg">
      <input id="reg-username" placeholder="Username" class="border p-3 w-full mb-3 rounded-lg">
      <input id="reg-email" placeholder="Email" type="email" class="border p-3 w-full mb-3 rounded-lg">
      <input id="reg-password" placeholder="Password" type="password" class="border p-3 w-full mb-3 rounded-lg">
      <input id="reg-mobile" placeholder="Mobile Number" class="border p-3 w-full mb-3 rounded-lg">
      <button onclick="register()" class="bg-blue-600 text-white px-6 py-3 rounded-lg w-full font-medium">Register</button>
    </div>

    <!-- Login -->
    <div class="bg-white p-6 rounded-xl shadow mb-6">
      <h2 class="text-xl font-semibold mb-4">2. Login</h2>
      <input id="login-username" placeholder="Username" class="border p-3 w-full mb-3 rounded-lg">
      <input id="login-password" placeholder="Password" type="password" class="border p-3 w-full mb-3 rounded-lg">
      <button onclick="login()" class="bg-green-600 text-white px-6 py-3 rounded-lg w-full font-medium">Login</button>
      <p id="token-display" class="mt-3 text-sm text-gray-600 break-all"></p>
    </div>

    <!-- Request OTP -->
    <div class="bg-white p-6 rounded-xl shadow mb-6">
      <h2 class="text-xl font-semibold mb-4">3. Request OTP for Membership</h2>
      <input id="otp-mobile" placeholder="Mobile Number" class="border p-3 w-full mb-3 rounded-lg">
      <select id="membership-type" class="border p-3 w-full mb-3 rounded-lg">
        <option value="gym_monthly">Gym Monthly</option>
        <option value="shopping_discount">Shopping Discount</option>
      </select>
      <button onclick="requestOTP()" class="bg-purple-600 text-white px-6 py-3 rounded-lg w-full font-medium">Send OTP</button>
    </div>

    <!-- Verify OTP -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-4">4. Verify OTP</h2>
      <input id="verify-mobile" placeholder="Mobile Number" class="border p-3 w-full mb-3 rounded-lg">
      <input id="verify-otp" placeholder="Enter 6-digit OTP" maxlength="6" class="border p-3 w-full mb-3 rounded-lg">
      <button onclick="verifyOTP()" class="bg-orange-600 text-white px-6 py-3 rounded-lg w-full font-medium">Verify & Activate Membership</button>
    </div>

    <div id="result" class="mt-6 text-center font-medium"></div>
  </div>

  <script>
    let token = "";

    async function register() {
      const data = {
        name: document.getElementById('reg-name').value,
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
        mobile_no: document.getElementById('reg-mobile').value
      };

      const res = await fetch('http://127.0.0.1:8000/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      showResult(JSON.stringify(result, null, 2), res.ok ? 'text-green-600' : 'text-red-600');
    }

    async function login() {
      const data = {
        username: document.getElementById('login-username').value,
        password: document.getElementById('login-password').value
      };

      const res = await fetch('http://127.0.0.1:8000/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      
      if (res.ok) {
        token = result.access_token;
        document.getElementById('token-display').innerHTML = `✅ Token Received!<br><small>${token.substring(0, 50)}...</small>`;
        showResult("Login Successful! Token saved.", "text-green-600");
      } else {
        showResult(result.detail, "text-red-600");
      }
    }

    async function requestOTP() {
      const data = {
        mobile_no: document.getElementById('otp-mobile').value,
        membership_type: document.getElementById('membership-type').value
      };

      const res = await fetch('http://127.0.0.1:8000/membership/request-otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      showResult(result.message || JSON.stringify(result), res.ok ? 'text-green-600' : 'text-red-600');
    }

    async function verifyOTP() {
      const data = {
        mobile_no: document.getElementById('verify-mobile').value,
        otp_code: document.getElementById('verify-otp').value,
        membership_type: document.getElementById('membership-type').value
      };

      const res = await fetch('http://127.0.0.1:8000/membership/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      showResult(result.message || JSON.stringify(result), res.ok ? 'text-green-600' : 'text-red-600');
    }

    function showResult(msg, color) {
      const div = document.getElementById('result');
      div.innerHTML = `<div class="${color}">${msg}</div>`;
    }
  </script>
</body>
</html>
